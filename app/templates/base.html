<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}AuroraCorp{% endblock %} | Portal del empleado</title><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"></head><body>
<header class="top"><a class="logo" href="{{'/workspace' if me else '/login'}}">◈ <strong>AURORA<span>CORP</span></strong><small>PORTAL DEL EMPLEADO</small></a><nav>{% if me %}<a href="/workspace" class="{{'active' if page=='workspace' else ''}}">Inicio</a><a href="/novedades" class="{{'active' if page=='novedades' else ''}}">Actualidad</a><a href="/documentos" class="{{'active' if page=='documentos' else ''}}">Documentación</a><a href="/soporte" class="{{'active' if page=='soporte' else ''}}">Ayuda</a><a href="/perfil" class="{{'active' if page=='perfil' else ''}}">Mi cuenta</a><form action="/logout" method="post"><button class="ghost">Cerrar sesión</button></form>{% endif %}</nav></header>
